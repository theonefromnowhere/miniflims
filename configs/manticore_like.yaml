# A scaled-down analogue of the Manticore-Local setup (McAlpine et al. 2025):
# several sub-catalogues with independent bias parameters sharing one matter
# field, sigmoid-truncated double power-law bias, generalized Poisson
# likelihood, a radial survey response, redshift-space distortions towards a
# central observer, and the power-spectrum prior with a likelihood ramp during
# burn-in. Gravity is Zel'dovich here, where Manticore uses COLA.
precision: float64

grid: {n_grid: 32, box_size: 500.0}

forward:
  model: zeldovich
  rsd: {enabled: true, los: radial}

galaxies:
  n_catalogues: 2
  nbar: {init: 2.0, lower: 0.01, upper: 100.0}
  bias:
    model: stdp
    # The bounds keep B(rho) monotonically increasing: the logarithmic slope is
    # at least alpha - beta^2 >= 0.5 - 0.49. Without them the posterior has a
    # mirror mode (delta -> -delta with a bias that decreases with density)
    # which chains started from a low-amplitude field can fall into.
    params:
      gamma_t: {init: -1.0, lower: -4.0, upper: 1.0}
      gamma_s: {init: 0.5, lower: 0.1, upper: 3.0}
      alpha: {init: 1.0, lower: 0.5, upper: 4.0}
      beta: {init: 0.3, lower: 0.0, upper: 0.7}
      beta_0: {init: 1.5, lower: 0.0, upper: 4.0}
  likelihood:
    model: generalized_poisson
    params:
      b_alpha: {init: 0.1}
      b_beta: {init: 0.0, sample: false}

data:
  source: mock
  mock:
    seed: 3
    truth:
      nbar: [4.0, 2.0]
      alpha: [1.2, 1.8]
      b_alpha: [0.2, 0.3]
    selections:
      - {type: radial, r0: 220.0, power: 2.0}
      - {type: radial, r0: 160.0, power: 2.0}

sampler:
  n_chains: 2
  n_warmup: 600
  n_samples: 600
  thin: 10
  hmc: {step_size: 0.01, n_steps: 30, n_steps_min: 10, target_accept: 0.7}
  init: {field_scale: 0.1, nuisance_jitter: 0.05}
  schedules:
    likelihood_temperature: {start: 0.1, end: 1.0, n_steps: 200, kind: geometric}
    lambda_ps: {start: 100.0, end: 100.0}

output:
  dir: runs/manticore_like
  log_every: 50
