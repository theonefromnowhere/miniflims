# Field-level inference of an oscillatory (feature) primordial bispectrum,
#   B_Phi = 6 f_NL (P1 P2 P3)^(2/3) sin(omega (k1 + k2 + k3)),
# on a 64^3, 1024 Mpc/h galaxy mock. Gibbs sweep: white-noise field (HMC,
# gradient through jaxpng's Phi_NG) -> bias (slice) -> f_NL and omega (slice).
#
# Truth f_NL = 500, omega = 20 Mpc/h; starts at f_NL = 0, omega = 15 (inside
# the omega likelihood basin, which spans ~9-31 Mpc/h at this f_NL).
# At the true field the data give sigma(f_NL) ~ 31 and sigma(omega) ~ 0.2 Mpc/h;
# the marginal posterior is wider because the field can absorb part of the signal.
# Cost on a laptop CPU: ~0.63 s per HMC gradient (Zel'dovich; tcola ~1.5 s).
precision: float64

grid: {n_grid: 64, box_size: 1024.0}

forward:
  model: zeldovich

png:
  enabled: true
  template: feature
  params:
    f_NL: {init: 0.0, lower: -5000.0, upper: 5000.0, width: 100.0}
    omega: {init: 15.0, lower: 5.0, upper: 60.0, width: 1.0, sample: true}
    phase: {init: 0.0}

# White-noise priors: Manticore's power-spectrum shape prior (lambda_ps = 100,
# their value) and a Gaussianity prior on the binned white-noise bispectrum,
# so the field cannot absorb the primordial non-Gaussianity that f_NL carries.
prior:
  lambda_ps: 100.0
  ps_prior_bins: 12
  bispectrum: {lambda_bs: 100.0, n_bins: 8}

galaxies:
  nbar: {init: 4.0, lower: 0.01, upper: 100.0}
  bias:
    model: power_law
    params:
      alpha: {init: 1.0, lower: 0.0, upper: 4.0}
  likelihood:
    model: poisson

data:
  source: mock
  mock:
    seed: 20
    truth: {nbar: 5.0, alpha: 1.5, f_NL: 500.0, omega: 20.0}

sampler:
  n_chains: 2
  n_warmup: 300
  n_samples: 500
  thin: 10
  blocks: [field, nuisance, png]
  hmc: {step_size: 0.02, n_steps: 20, n_steps_min: 10, target_accept: 0.7}
  checkpoint: {every: 20}

output:
  dir: runs/png_feature_w20_priors
  log_every: 20
