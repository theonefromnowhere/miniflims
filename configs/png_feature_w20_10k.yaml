# Long rerun of runs/png_feature_w20 (cluster): the same model, mock, sampler
# and starting point, 10 000 Gibbs sweeps instead of 800.
#
# Feature primordial bispectrum B_Phi = 6 f_NL (P1 P2 P3)^(2/3) sin(omega (k1 + k2 + k3))
# on a 64^3, 1024 Mpc/h Zel'dovich galaxy mock (seed 20, nbar 5, alpha 1.5);
# truth f_NL = 500, omega = 20 Mpc/h; start f_NL = 0, omega = 15.
# Gibbs sweep: white-noise field (HMC, gradient through jaxpng's Phi_NG) ->
# bias (slice) -> f_NL and omega (slice). No power-spectrum or bispectrum
# priors on the white noise (configs/png_feature_w20.yaml has them).
#
# On a laptop CPU the 800-sweep run (and its extensions) went at ~190 sweeps/h
# and was still at omega ~ 12, f_NL ~ -350 after 1300 sweeps.
# Field samples: every 10th sweep after warm-up, 4.2 MB each (~4 GB in total).
#
#   cluster/slurm/submit.sh configs/png_feature_w20_10k.yaml
precision: float64

grid: {n_grid: 64, box_size: 1024.0}

forward:
  model: zeldovich

png:
  enabled: true
  template: feature
  params:
    f_NL: {init: 0.0, lower: -5000.0, upper: 5000.0, width: 100.0}
    omega: {init: 15.0, lower: 5.0, upper: 60.0, width: 1.0, sample: true}
    phase: {init: 0.0}

galaxies:
  nbar: {init: 4.0, lower: 0.01, upper: 100.0}
  bias:
    model: power_law
    params:
      alpha: {init: 1.0, lower: 0.0, upper: 4.0}
  likelihood:
    model: poisson

data:
  source: mock
  mock:
    seed: 20
    truth: {nbar: 5.0, alpha: 1.5, f_NL: 500.0, omega: 20.0}

sampler:
  n_chains: 2
  n_warmup: 300
  n_samples: 9700
  thin: 10
  blocks: [field, nuisance, png]
  hmc: {step_size: 0.02, n_steps: 20, n_steps_min: 10, target_accept: 0.7}
  checkpoint: {every: 20}

output:
  dir: runs/png_feature_w20_10k
  log_every: 20
  progress_interval: 60
