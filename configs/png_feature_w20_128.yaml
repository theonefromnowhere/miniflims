# png_feature_w20_10k at twice the resolution: 128^3 in the same 1024 Mpc/h box
# (8 Mpc/h cells, k_Nyquist = 0.393 h/Mpc instead of 0.196). At 64^3 the
# triangles reach k1 + k2 + k3 <= 0.59 h/Mpc, less than two periods of the
# true sin(omega sum k) (2 pi / 20 = 0.31 h/Mpc), and the chains settled on
# an alias (omega ~ 12, f_NL ~ -420); here they reach ~1.2 h/Mpc.
#
# Same truth (f_NL = 500, omega = 20, alpha = 1.5), same starting point and
# sampler. The galaxy number density is kept: nbar per cell 5 / 8 = 0.625
# (~1.31 million galaxies, as at 64^3). The white noise (seed 20) is a new
# 128^3 realization, not a refinement of the 64^3 one.
# Field samples every 50 sweeps (16.8 MB each with 2 chains, ~3.3 GB).
#
#   cluster/slurm/submit.sh configs/png_feature_w20_128.yaml
precision: float64

grid: {n_grid: 128, box_size: 1024.0}

forward:
  model: zeldovich

png:
  enabled: true
  template: feature
  params:
    f_NL: {init: 0.0, lower: -5000.0, upper: 5000.0, width: 100.0}
    omega: {init: 15.0, lower: 5.0, upper: 60.0, width: 1.0, sample: true}
    phase: {init: 0.0}

galaxies:
  nbar: {init: 0.5, lower: 0.001, upper: 20.0}
  bias:
    model: power_law
    params:
      alpha: {init: 1.0, lower: 0.0, upper: 4.0}
  likelihood:
    model: poisson

data:
  source: mock
  mock:
    seed: 20
    truth: {nbar: 0.625, alpha: 1.5, f_NL: 500.0, omega: 20.0}

sampler:
  n_chains: 2
  n_warmup: 300
  n_samples: 9700
  thin: 50
  blocks: [field, nuisance, png]
  hmc: {step_size: 0.02, n_steps: 20, n_steps_min: 10, target_accept: 0.7}
  checkpoint: {every: 20}

output:
  dir: runs/png_feature_w20_128
  log_every: 20
  progress_interval: 60
