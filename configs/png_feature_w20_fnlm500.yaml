# png_feature_w20_10k with the opposite sign: truth f_NL = -500, omega = 20.
# Same 64^3, 1024 Mpc/h Zel'dovich mock (seed 20), starting point (f_NL = 0,
# omega = 15) and sampler, 10 000 sweeps. Tests whether the omega ~ 12 alias
# found for f_NL = +500 (sin(20 s) ~ -sin(12 s) near s = k1 + k2 + k3 ~ 0.4 h/Mpc)
# appears with the sign flipped (omega ~ 12, f_NL ~ +420).
#
#   cluster/slurm/submit.sh configs/png_feature_w20_fnlm500.yaml
precision: float64

grid: {n_grid: 64, box_size: 1024.0}

forward:
  model: zeldovich

png:
  enabled: true
  template: feature
  params:
    f_NL: {init: 0.0, lower: -5000.0, upper: 5000.0, width: 100.0}
    omega: {init: 15.0, lower: 5.0, upper: 60.0, width: 1.0, sample: true}
    phase: {init: 0.0}

galaxies:
  nbar: {init: 4.0, lower: 0.01, upper: 100.0}
  bias:
    model: power_law
    params:
      alpha: {init: 1.0, lower: 0.0, upper: 4.0}
  likelihood:
    model: poisson

data:
  source: mock
  mock:
    seed: 20
    truth: {nbar: 5.0, alpha: 1.5, f_NL: -500.0, omega: 20.0}

sampler:
  n_chains: 2
  n_warmup: 300
  n_samples: 9700
  thin: 10
  blocks: [field, nuisance, png]
  hmc: {step_size: 0.02, n_steps: 20, n_steps_min: 10, target_accept: 0.7}
  checkpoint: {every: 20}

output:
  dir: runs/png_feature_w20_fnlm500
  log_every: 20
  progress_interval: 60
