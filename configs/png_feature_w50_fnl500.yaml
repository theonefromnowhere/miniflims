# Feature PNG at a higher frequency: truth f_NL = 500, omega = 50 Mpc/h
# (period 2 pi / 50 = 0.126 h/Mpc in k1 + k2 + k3: ~4.7 periods up to the
# 64^3 Nyquist limit, vs < 2 for omega = 20). Same mock (seed 20) and sampler
# as png_feature_w20_10k, 10 000 sweeps. Starts 5 Mpc/h below the truth as the
# omega = 20 runs do (omega = 45; f_NL = 0); omega bounds 5-80 so the truth is
# not near an edge.
#
#   cluster/slurm/submit.sh configs/png_feature_w50_fnl500.yaml
precision: float64

grid: {n_grid: 64, box_size: 1024.0}

forward:
  model: zeldovich

png:
  enabled: true
  template: feature
  params:
    f_NL: {init: 0.0, lower: -5000.0, upper: 5000.0, width: 100.0}
    omega: {init: 45.0, lower: 5.0, upper: 80.0, width: 1.0, sample: true}
    phase: {init: 0.0}

galaxies:
  nbar: {init: 4.0, lower: 0.01, upper: 100.0}
  bias:
    model: power_law
    params:
      alpha: {init: 1.0, lower: 0.0, upper: 4.0}
  likelihood:
    model: poisson

data:
  source: mock
  mock:
    seed: 20
    truth: {nbar: 5.0, alpha: 1.5, f_NL: 500.0, omega: 50.0}

sampler:
  n_chains: 2
  n_warmup: 300
  n_samples: 9700
  thin: 10
  blocks: [field, nuisance, png]
  hmc: {step_size: 0.02, n_steps: 20, n_steps_min: 10, target_accept: 0.7}
  checkpoint: {every: 20}

output:
  dir: runs/png_feature_w50_fnl500
  log_every: 20
  progress_interval: 60
