# Null test for runs/png_feature_w20: the same 64^3, 1024 Mpc/h Zel'dovich
# galaxy mock (seed 20, so the same Gaussian white noise; nbar 5, alpha 1.5)
# but Gaussian (truth f_NL = 0), analysed with the same feature-PNG model and
# sampler: f_NL and omega sampled from the same starting point. The posterior
# of f_NL should be consistent with 0 (omega is then unconstrained); a
# spurious f_NL, or the same slow large-scale burn-in, would show how much of
# the w20 result comes from the sampler rather than from the PNG in the data.
precision: float64

grid: {n_grid: 64, box_size: 1024.0}

forward:
  model: zeldovich

png:
  enabled: true
  template: feature
  params:
    f_NL: {init: 0.0, lower: -5000.0, upper: 5000.0, width: 100.0}
    omega: {init: 15.0, lower: 5.0, upper: 60.0, width: 1.0, sample: true}
    phase: {init: 0.0}

galaxies:
  nbar: {init: 4.0, lower: 0.01, upper: 100.0}
  bias:
    model: power_law
    params:
      alpha: {init: 1.0, lower: 0.0, upper: 4.0}
  likelihood:
    model: poisson

data:
  source: mock
  mock:
    seed: 20
    truth: {nbar: 5.0, alpha: 1.5, f_NL: 0.0}

sampler:
  n_chains: 2
  n_warmup: 300
  n_samples: 500
  thin: 10
  blocks: [field, nuisance, png]
  hmc: {step_size: 0.02, n_steps: 20, n_steps_min: 10, target_accept: 0.7}
  checkpoint: {every: 20}

output:
  dir: runs/png_null_w20
  log_every: 20
  progress_interval: 60
